<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>snake</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/themes.css">
    <style>
        /* Scoping a [data-theme="dark"] (non :root) così le varianti di
           themes.css ([data-theme="brutal"] ecc.) non vengono sovrascritte */
        [data-theme="dark"] {
            --cal-bg: #0d1117;
            --cal-header-bg: #161b22;
            --cal-border: #30363d;
            --cal-text: #e6edf3;
            --cal-text-muted: #8b949e;
            --accent-color: #44633F;
        }

        [data-theme="light"] {
            --cal-bg: #f6f8fa;
            --cal-header-bg: #ffffff;
            --cal-border: #d0d7de;
            --cal-text: #24292f;
            --cal-text-muted: #656d76;
            --accent-color: #6a8d60;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono Nerd', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--cal-bg);
            color: var(--cal-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        html {
            overflow: hidden;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--cal-text);
        }

        /* Header e box di gioco condividono la stessa larghezza: bordi allineati */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            width: min(100%, 356px);
        }

        .game-container {
            background: var(--cal-header-bg);
            border: 1px solid var(--cal-border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: min(100%, 356px);
        }

        #gameCanvas {
            background: var(--cal-bg);
            border: 2px solid var(--cal-border);
            border-radius: 4px;
            max-width: 100%;
            height: auto;
            touch-action: none; /* il campo di gioco gestisce lo swipe, niente scroll */
        }

        /* Bottone tema: feedback visibile in dark/light (brutal gestito da themes.css) */
        [data-theme="dark"] .theme-toggle:hover, [data-theme="light"] .theme-toggle:hover {
            background: var(--accent-color);
            opacity: 1;
            filter: brightness(1.3);
        }
        [data-theme="dark"] .theme-toggle:active, [data-theme="light"] .theme-toggle:active {
            filter: brightness(1.6);
        }

        .score {
            font-size: 1.25rem;
            color: var(--cal-text);
            cursor: pointer;
            user-select: none;
        }

        .settings-menu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--cal-header-bg);
            border: 1px solid var(--cal-border);
            border-radius: 12px;
            padding: 1.5rem;
            z-index: 100;
            display: none;
            flex-direction: column;
            gap: 0.75rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .settings-menu.show {
            display: flex;
        }

        .settings-menu h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1rem;
            text-align: center;
        }

        .settings-menu button {
            background: var(--cal-border);
            color: var(--cal-text);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.2s;
        }

        .settings-menu button:hover {
            background: var(--accent-color);
        }

        .settings-menu button.active {
            background: var(--accent-color);
        }

        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
            display: none;
        }

        .settings-overlay.show {
            display: block;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn.secondary {
            background: var(--cal-border);
        }

        .instructions {
            color: var(--cal-text-muted);
            font-size: 0.8rem;
            text-align: center;
            max-width: 300px;
        }

        .back-link {
            margin-top: 1rem;
            color: var(--cal-text-muted);
            text-decoration: none;
            font-size: 0.875rem;
        }

        .back-link:hover {
            color: var(--cal-text);
        }

        .mobile-back {
            display: none;
            position: fixed;
            top: 10px;
            left: 10px;
            color: var(--cal-text-muted);
            text-decoration: none;
            font-size: 1.25rem;
            opacity: 0.3;
            z-index: 50;
        }

        .mobile-back:hover {
            opacity: 1;
        }

        .dpad {
            display: none;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 5px;
            margin-top: 1rem;
            touch-action: none;
        }

        .dpad-btn {
            background: var(--cal-header-bg);
            border: 1px solid var(--cal-border);
            border-radius: 8px;
            color: var(--cal-text);
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s;
        }

        .dpad-btn:active {
            background: var(--cal-border);
        }

        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 2; }

        .speed-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        /* Cambia layout: utile solo dove la dpad esiste (mobile) */
        .layout-btn {
            display: none;
        }

        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
            }
            .controls {
                order: -1;
            }
            .dpad {
                display: grid;
            }
            .layout-btn {
                display: flex;
            }
            .instructions {
                display: none;
            }
            .back-link {
                display: none;
            }
            .mobile-back {
                display: block;
            }
            .dpad.layout-old {
                grid-template-columns: repeat(3, 50px);
                grid-template-rows: repeat(3, 50px);
            }
            .dpad.layout-old .dpad-up { grid-column: 2; grid-row: 1; }
            .dpad.layout-old .dpad-left { grid-column: 1; grid-row: 2; }
            .dpad.layout-old .dpad-right { grid-column: 3; grid-row: 2; }
            .dpad.layout-old .dpad-down { grid-column: 2; grid-row: 3; }
        }
    </style>
    <script src="js/theme.js"></script>
</head>
<body>
    <header>
        <h1 style="margin:0;">🐍 Snake</h1>
        <button class="btn theme-toggle" id="themeToggle" title="Cambia tema" aria-label="Cambia tema" style="padding:0.4rem 0.6rem;">
            <i class="nf nf-fa-circle_half"></i>
        </button>
    </header>
    <div class="game-container">
        <div class="score" id="scoreEl" title="Tieni premuto per impostazioni">Punteggio: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="300" height="300"></canvas>
        <div class="controls">
            <button class="btn" id="startBtn" onclick="startGame(false)">Start</button>
            <button class="btn secondary" onclick="resetGame()">Reset</button>
            <button class="btn secondary speed-btn" onclick="showSettings()" title="Velocità"><i class="nf nf-fa-gauge_high"></i></button>
            <button class="btn secondary speed-btn layout-btn" onclick="toggleLayout()" title="Cambia layout"><i class="nf nf-fa-exchange"></i></button>
        </div>
        <p class="instructions">Usa le frecce direzionali, WASD o h/j/k/l (nvim) per muovere il serpente — su mobile trascina sul campo di gioco</p>
        <div class="dpad">
            <button class="dpad-btn dpad-up" oncontextmenu="return false;" onclick="handleDirection('up')"><i class="nf nf-fa-chevron_up"></i></button>
            <button class="dpad-btn dpad-left" oncontextmenu="return false;" onclick="handleDirection('left')"><i class="nf nf-fa-chevron_left"></i></button>
            <button class="dpad-btn dpad-down" oncontextmenu="return false;" onclick="handleDirection('down')"><i class="nf nf-fa-chevron_down"></i></button>
            <button class="dpad-btn dpad-right" oncontextmenu="return false;" onclick="handleDirection('right')"><i class="nf nf-fa-chevron_right"></i></button>
        </div>
    </div>
    <a href="index.html" class="back-link">← Torna all'orario</a>
    <a href="index.html" class="mobile-back"><i class="nf nf-fa-arrow_left"></i></a>

    <div class="settings-overlay" id="settingsOverlay"></div>
    <div class="settings-menu" id="settingsMenu">
        <h3>Velocità</h3>
        <button data-speed="0" onclick="setSpeed(0, this)">Incrementale</button>
        <button data-speed="100" class="active" onclick="setSpeed(100, this)">Normale</button>
        <button data-speed="70" onclick="setSpeed(70, this)">Difficile</button>
        <button data-speed="40" onclick="setSpeed(40, this)">Impossibile</button>
    </div>

    <footer>
        <p class="footer-line">
            <span>sarto</span><span class="footer-sep">|</span><span>A.S. 2026/2027</span>
        </p>
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const startBtn = document.getElementById('startBtn');

        const gridSize = 15;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 10, y: 10 };
        let dx = 0;
        let dy = 0;
        // Direzione dell'ultimo tick: i cambi direzione si validano contro
        // questa (non contro dx/dy) così due tasti nello stesso tick non
        // possono girare il serpente di 180° e finire nel collo.
        let lastDx = 1;
        let lastDy = 0;
        let score = 0;
        let gameLoop = null;
        let isRunning = false;
        let isPaused = false;
        let gameSpeed = 100;
        let highScore = parseInt(localStorage.getItem('snakeHighScore') || '0', 10) || 0;

        let settingsTimer = null;
        const scoreEl = document.getElementById('scoreEl');
        const settingsMenu = document.getElementById('settingsMenu');
        const settingsOverlay = document.getElementById('settingsOverlay');

        // Pointer events: il lungo-press funziona sia con mouse che touch
        scoreEl.addEventListener('pointerdown', () => {
            settingsTimer = setTimeout(() => {
                settingsMenu.classList.add('show');
                settingsOverlay.classList.add('show');
            }, 400);
        });

        ['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => {
            scoreEl.addEventListener(evt, () => clearTimeout(settingsTimer));
        });

        settingsOverlay.addEventListener('click', () => {
            settingsMenu.classList.remove('show');
            settingsOverlay.classList.remove('show');
        });

        window.showSettings = function() {
            settingsMenu.classList.add('show');
            settingsOverlay.classList.add('show');
        };

        window.toggleLayout = function() {
            const dpad = document.querySelector('.dpad');
            dpad.classList.toggle('layout-old');
        };

        window.setSpeed = function(speed, btn) {
            gameSpeed = speed;
            document.querySelectorAll('.settings-menu button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            settingsMenu.classList.remove('show');
            settingsOverlay.classList.remove('show');
            if (isRunning) {
                clearInterval(gameLoop);
                const interval = gameSpeed === 0 ? currentSpeed : gameSpeed;
                gameLoop = setInterval(update, interval);
            }
        };

        let currentSpeed = 120;

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            score = 0;
            dx = 1;
            dy = 0;
            lastDx = 1;
            lastDy = 0;
            currentSpeed = gameSpeed === 0 ? 120 : gameSpeed;
            scoreElement.textContent = score;
            placeFood();
            draw();
        }

        function placeFood() {
            if (snake.length >= tileCount * tileCount) return;
            let x, y;
            do {
                x = Math.floor(Math.random() * tileCount);
                y = Math.floor(Math.random() * tileCount);
            } while (snake.some(segment => segment.x === x && segment.y === y));
            food.x = x;
            food.y = y;
        }

        // Colori presi dal tema attivo (--cal-bg / --accent-color), così la
        // canvas segue chiaro/scuro e i due brutal.
        function themeColors() {
            const cs = getComputedStyle(document.documentElement);
            return {
                bg: (cs.getPropertyValue('--cal-bg') || '#000').trim() || '#000',
                body: (cs.getPropertyValue('--accent-color') || '#44633F').trim() || '#44633F',
                food: '#f85149'
            };
        }

        function draw() {
            const c = themeColors();

            ctx.fillStyle = c.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = c.body;
            snake.forEach((segment, index) => {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );
            });

            ctx.fillStyle = c.food;
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize - 2,
                gridSize - 2
            );
        }

        // Ridisegna quando cambia il tema (il picker emette 'themechange')
        document.addEventListener('themechange', function () { draw(); });

        function update() {
            lastDx = dx;
            lastDy = dy;
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                placeFood();
                if (gameSpeed === 0 && currentSpeed > 30) {
                    currentSpeed -= 5;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, currentSpeed);
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function gameOver() {
            isRunning = false;
            isPaused = false;
            clearInterval(gameLoop);
            startBtn.textContent = 'Start';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', String(highScore));
            }
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f85149';
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2);
            if (highScore > 0) {
                ctx.font = '14px sans-serif';
                ctx.fillStyle = '#8b949e';
                ctx.fillText('Best: ' + highScore, canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        function startGame(saveDirection = false) {
            if (isRunning) {
                // Pausa: ferma il loop, mantiene serpente e punteggio
                isRunning = false;
                isPaused = true;
                clearInterval(gameLoop);
                startBtn.textContent = 'Riprendi';
                return;
            }
            if (isPaused) {
                // Riprende dal punto in cui era
                isRunning = true;
                isPaused = false;
                startBtn.textContent = 'Pausa';
                const interval = gameSpeed === 0 ? currentSpeed : gameSpeed;
                gameLoop = setInterval(update, interval);
                return;
            }
            const savedDx = dx;
            const savedDy = dy;
            isRunning = true;
            initGame();
            if (saveDirection && (savedDx !== 0 || savedDy !== 0)) {
                // Ripristina la direzione solo se non punta nel collo
                // (alla partenza il corpo è a sinistra della testa)
                const nx = snake[0].x + savedDx;
                const ny = snake[0].y + savedDy;
                if (!snake.some(s => s.x === nx && s.y === ny)) {
                    dx = savedDx;
                    dy = savedDy;
                    lastDx = dx;
                    lastDy = dy;
                }
            }
            startBtn.textContent = 'Pausa';
            const interval = gameSpeed === 0 ? currentSpeed : gameSpeed;
            gameLoop = setInterval(update, interval);
        }

        function resetGame() {
            isRunning = false;
            isPaused = false;
            clearInterval(gameLoop);
            startBtn.textContent = 'Start';
            initGame();
        }

        function setDirection(dir) {
            switch (dir) {
                case 'up':
                    if (lastDy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'down':
                    if (lastDy !== -1) { dx = 0; dy = 1; }
                    break;
                case 'left':
                    if (lastDx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'right':
                    if (lastDx !== -1) { dx = 1; dy = 0; }
                    break;
            }
        }

        function handleDirection(dir) {
            if (!isRunning) {
                startGame(true);
            }
            setDirection(dir);
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            const code = e.code;
            const keyCode = e.keyCode;

            let dir = null;
            if (key === 'arrowup' || key === 'k' || key === 'w' || code === 'KeyW' || keyCode === 87) dir = 'up';
            else if (key === 'arrowdown' || key === 'j' || key === 's' || code === 'KeyS' || keyCode === 83) dir = 'down';
            else if (key === 'arrowleft' || key === 'h' || key === 'a' || code === 'KeyA' || keyCode === 65) dir = 'left';
            else if (key === 'arrowright' || key === 'l' || key === 'd' || code === 'KeyD' || keyCode === 68) dir = 'right';

            if (dir) {
                e.preventDefault();
                handleDirection(dir);
            }
        });

        // Swipe sul campo di gioco: trascina in una direzione per cambiare verso.
        // (touch-action:none sul canvas evita scroll/zoom durante il gesto)
        (function initSwipe() {
            var SOGLIA = 24;   // px minimi per riconoscere uno swipe
            var sx = 0, sy = 0, tracking = false;

            canvas.addEventListener('touchstart', function (e) {
                if (e.touches.length !== 1) { tracking = false; return; }
                tracking = true;
                sx = e.touches[0].clientX;
                sy = e.touches[0].clientY;
            }, { passive: true });

            canvas.addEventListener('touchend', function (e) {
                if (!tracking) return;
                tracking = false;
                var t = e.changedTouches && e.changedTouches[0];
                if (!t) return;
                var dx = t.clientX - sx;
                var dy = t.clientY - sy;
                if (Math.abs(dx) < SOGLIA && Math.abs(dy) < SOGLIA) return;   // tap: ignora
                if (Math.abs(dx) > Math.abs(dy)) handleDirection(dx > 0 ? 'right' : 'left');
                else handleDirection(dy > 0 ? 'down' : 'up');
            }, { passive: true });

            canvas.addEventListener('touchcancel', function () { tracking = false; }, { passive: true });
        })();

        initGame();
    </script>
</body>
</html>
