<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orario - sarto 🪡</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sigmaorario</h1>
            <nav class="main-nav">
                <a href="index.html" class="active">Orario</a>
                <a href="calendario.html">Calendario</a>
            </nav>
            <div class="header-controls">
                <button class="btn lock-toggle" id="settingsMemorize" title="UI automatica" aria-label="Memorizza impostazioni">
                    <i class="nf nf-md-lock_open"></i>
                </button>
                <div class="density-control" style="display:flex;align-items:center;gap:0.5rem;">
                    <label for="densitySlider" title="Densità righe" style="display:flex;align-items:center;gap:0.3rem;color:var(--cal-text-muted);font-size:0.65rem;">
                        <i class="nf nf-fa-minimize"></i>
                        <input type="range" id="densitySlider" min="0" max="100" value="50" style="width:80px;accent-color:var(--cal-green);">
                        <i class="nf nf-fa-maximize"></i>
                    </label>
                </div>
                <button class="btn theme-toggle" id="themeToggle" title="Cambia tema" aria-label="Cambia tema">
                    <i class="nf nf-fa-sun"></i>
                </button>
            </div>
        </header>

        <main>
            <div class="current-info">
                <div class="info-item">
                    <span class="label">Ora:</span>
                    <span class="value" id="currentTime">--:--</span>
                </div>
                <div class="info-item">
                    <span class="label">Giorno:</span>
                    <span class="value" id="currentDay">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Lezione:</span>
                    <span class="value highlight" id="currentLesson">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Prossima:</span>
                    <span class="value" id="nextLesson">-</span>
                </div>
            </div>

            <div class="schedule-container">
                <div class="schedule-header">
                    <h2><i class="nf nf-fa-calendar_week"></i> Orario Settimanale</h2>
                    <div>
                        <button class="btn" onclick="exportSchedule()">
                            <i class="nf nf-fa-download"></i> Esporta
                        </button>
                        <button class="btn" onclick="printSchedule()">
                            <i class="nf nf-fa-print"></i> Stampa
                        </button>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table id="scheduleTable">
                        <thead>
                            <tr>
                                <th>Ora</th>
                                <th>Lunedì</th>
                                <th>Martedì</th>
                                <th>Mercoledì</th>
                                <th>Giovedì</th>
                                <th>Venerdì</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <span class="legend-color lab"></span>
                    <span>Laboratorio</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color today"></span>
                    <span>Lezione attuale</span>
                </div>
            </div>

            <div class="actions-bar">
                <div class="actions-group">
                    <button class="btn" onclick="showToday()" title="Evidenzia il giorno corrente">
                        <i class="nf nf-fa-calendar_day"></i> Oggi
                    </button>
                    <button class="btn" onclick="toggleLabs()" title="Mostra/nascondi laboratori">
                        <i class="nf nf-fa-flask"></i> Lab
                    </button>
                </div>
                <div class="divider"></div>
                <div class="actions-group">
                    <button class="btn" onclick="resetView()" title="Ripristina vista originale">
                        <i class="nf nf-fa-undo"></i> Reset
                    </button>
                </div>
                <div class="actions-search">
                    <input type="text" id="searchMateria" placeholder="Cerca materia...">
                    <button class="btn" onclick="searchMateria()" title="Cerca">
                        <i class="nf nf-fa-search"></i>
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>sarto - A.S. 2026/2027 · <a href="https://github.com/lowtaper42069/sigmaorario" target="_blank" rel="noopener"><i class="nf nf-dev-github"></i> GitHub</a></p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/realtime.js"></script>
    <a href="snake.html" class="easter-egg">🐍</a>
</body>
</html>
